<html>

<head>
    <meta charset="utf=8" />
    <title>Formulário</title>
</head>

<body>

    <p>
        <bold>Informe as notas para verificação se foi aprovado ou reprovado:</bold>
    </p>
    <form action="/" method="get">
        <p>
            <label for="n1">
                Nota 1
            </label>
            <input type="number" step="0.1" name="n1" id="n1" required />
        </p>
        <p>
            <label for="n2">
                Nota 2
            </label>
            <input type="number" step="0.1" name="n2" id="n2" required />
        </p>
        <p>
            <label for="n3">
                Nota 3
            </label>
            <input type="number" step="0.1" name="n3" id="n3" required />
        </p>
        <p>
            <label for="n4">
                Nota 4
            </label>
            <input type="number" step="0.1" name="n4" id="n4" required />
        </p>
        <button type="submit">Enviar</button>
    </form>
</body>

</html>
